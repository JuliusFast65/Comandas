<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comandas</title><link rel="stylesheet" href="app.css"><script src="scripts.js" defer></script>
</head>
<body>
<header><h1>Comandas</h1><div id="identity"></div></header>
<p id="message" role="status" aria-live="polite"></p>
<main>
<section id="login"><h2>Iniciar sesión</h2>
<form id="login-form">
<label>Usuario<input name="username" autocomplete="username" required maxlength="80"></label>
<label>Contraseña<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
<button>Entrar</button>
</form></section>
<section id="workspace" hidden><nav id="navigation" aria-label="Áreas"></nav><div id="content"></div></section>
</main></body></html>
