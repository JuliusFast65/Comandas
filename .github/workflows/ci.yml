name: Pruebas

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: comandas
          POSTGRES_PASSWORD: comandas-ci-only
          POSTGRES_DB: comandas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comandas -d comandas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Disposable database of this job; the tests create and drop their own.
      DATABASE_URL: postgresql://comandas:comandas-ci-only@127.0.0.1:5432/comandas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
